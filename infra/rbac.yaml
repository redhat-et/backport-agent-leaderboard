apiVersion: v1
kind: ServiceAccount
metadata:
  name: eval-result-writer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-writer
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  # create/update/patch — eval pods save results
  # get/list           — collector reads results back
  verbs: ["create", "update", "patch", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eval-result-writer-binding
subjects:
- kind: ServiceAccount
  name: eval-result-writer
roleRef:
  kind: Role
  name: configmap-writer
  apiGroup: rbac.authorization.k8s.io
---
# Leaderboard pod — read-only access to result ConfigMaps
apiVersion: v1
kind: ServiceAccount
metadata:
  name: leaderboard-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-reader
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leaderboard-reader-binding
subjects:
- kind: ServiceAccount
  name: leaderboard-reader
roleRef:
  kind: Role
  name: configmap-reader
  apiGroup: rbac.authorization.k8s.io
