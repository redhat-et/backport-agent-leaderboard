schema_version = "1.3"
artifacts = ["/workspace/workdir", "/workspace/amalgamator/runs", "/workspace/case.yaml"]

[task]
name = "redhat-et/crio-server-run-post-stop-hooks-before-release-1-32"
authors = [{ name = "Surya Prakash Pathak", email = "supathak@redhat.com" }]

[metadata]
difficulty = "hard"
difficulty_explanation = """
Hard cri-o/cri-o backport (similarity=0.40; file_overlap=0.50; size_ratio=0.65; orig_files=4; back_files=4).
Original fix 8f893226 (on release-1.34) -> human backport e01b6e57 on release-1.32.
Target = 04fff034, the pre-backport tip of release-1.32. Golden = the real human
backport diff. Era toolchain golang:1.23-bookworm (from the target pin's go.mod, go
1.23). Verification = full-tree `go build` (vendor mode) + full
`go test -short -count=1` suite. Target tree carries committed test-environment guards (treefix.patch: rro events) so the full suite is deterministic in-container; test-infra only, ports of upstream commits.
"""
category = "programming"

[verifier]
timeout_sec = 18000.0

[agent]
timeout_sec = 18000.0

[environment]
network_mode = "public"
build_timeout_sec = 3600.0
