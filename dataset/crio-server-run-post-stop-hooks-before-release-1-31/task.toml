authors = [{ name = "Surya Prakash Pathak", email = "supathak@redhat.com" }]

[metadata]
difficulty = "medium"
difficulty_explanation = """
Medium cri-o/cri-o backport (similarity=0.75; file_overlap=0.75; size_ratio=0.80; orig_files=4; back_files=4).
Original fix 8f893226 (on release-1.34) -> human backport 469b85ce on release-1.31.
Target = a9fa4c63, the pre-backport tip of release-1.31. Golden = the real human
backport diff. Era toolchain golang:1.22-bookworm (from the target pin's go.mod, go
1.22). Verification = full-tree `go build` (vendor mode) + full
`go test -short -count=1` suite. Target tree carries committed test-environment guards (treefix.patch: rro gomock shim events) so the full suite is deterministic in-container; test-infra only, ports of upstream commits.
"""
category = "programming"

