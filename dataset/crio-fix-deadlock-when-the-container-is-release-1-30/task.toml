Original fix 1e751b49 (on main) -> human backport 818fbcad on release-1.30.
Target = b6af3c84, the pre-backport tip of release-1.30. Golden = the real human
backport diff. Era toolchain golang:1.22-bookworm (from the target pin's go.mod, go
1.22). Verification = full-tree `go build` (vendor mode) + full
`go test -short -count=1` suite. Target tree carries committed test-environment guards (treefix.patch: pidns rro events) so the full suite is deterministic in-container; test-infra only, ports of upstream commits.
"""
