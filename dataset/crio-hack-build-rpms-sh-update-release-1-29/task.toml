schema_version = "1.3"
artifacts = ["/workspace/workdir", "/workspace/amalgamator/runs", "/workspace/case.yaml"]

[task]
name = "redhat-et/crio-hack-build-rpms-sh-update-release-1-29"
authors = [{ name = "Surya Prakash Pathak", email = "supathak@redhat.com" }]

[metadata]
difficulty = "easy"
difficulty_explanation = """
Easy cri-o/cri-o backport (similarity=1.00; file_overlap=1.00; size_ratio=1.00; orig_files=2; back_files=2).
Original fix 8d3a11ee (on main) -> human backport 2078d1e5 on release-1.29.
Target = 940ae8bf, the pre-backport tip of release-1.29. Golden = the real human
backport diff. Era toolchain golang:1.21-bookworm (from the target pin's go.mod, go
1.21). Verification = full-tree `go build` (vendor mode) + full
`go test -short -count=1` suite + content markers for the packaging change (the fix touches no Go code, so the build/test gates alone cannot distinguish a correct backport from a no-op). Target tree carries committed test-environment guards (treefix.patch: pidns events) so the full suite is deterministic in-container; test-infra only, ports of upstream commits.
"""
category = "programming"

[verifier]
timeout_sec = 18000.0

[agent]
timeout_sec = 18000.0

[environment]
network_mode = "public"
build_timeout_sec = 3600.0
