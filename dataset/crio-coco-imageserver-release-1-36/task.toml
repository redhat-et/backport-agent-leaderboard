schema_version = "1.3"
artifacts = ["/workspace/workdir", "/workspace/amalgamator/runs", "/workspace/case.yaml"]

[task]
name = "redhat-et/crio-coco-imageserver-release-1-36"
authors = [{ name = "Surya Pathak", email = "supathak@redhat.com" }]

[metadata]
difficulty_explanation = """
Hard FEATURE backport: PR #9907 (CoCO image-server support), 39 files on main,
conflicts on raw cherry-pick and requires API adaptation (mainline keys service
caches per SandboxInfo and assumes a rewritten ociartifact datastore, neither
present on release-1.36; the fix's new datastore methods must be
re-implemented against the older Store). Verification = full-tree build + full
short unit suite + ported-tests existence; a wrong API adaptation fails to
compile tree-wide. NOTE: no official human backport to release-1.36 exists
upstream; the oracle golden is the amalgamator run of 2026-09-05
(solution/golden.patch), so the oracle validates task wiring, not a human gold.
"""
category = "programming"

[verifier]
timeout_sec = 18000.0   # 5 hours

[agent]
timeout_sec = 18000.0   # 5 hours

[environment]
network_mode = "public"
