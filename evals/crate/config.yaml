# crate/crate evaluation config
# Edit this file to change what runs — no Python code changes needed.

repo: crate/crate
lang: java
clone_url: https://github.com/crate/crate.git

# Optional: path to a local git clone used to read commit metadata (test class, module, branch).
# Defaults to ../benchmark-repos/<repo-name> relative to the repo root.
# local_clone: ~/code/crate

# ── Dataset ────────────────────────────────────────────────────────────────
dataset:
  csv: ../../backports.csv
  limit: null           # null = all | integer = random sample
  seed: 42
  classification: null  # null | "Easy" | "Medium" | "Hard"

# ── Build & test commands ──────────────────────────────────────────────────
# {module}     → auto-detected Maven module from files changed in each orig commit
# {test_class} → *Test.java file changed in each orig commit
#
# Full flags included so the runner is language-agnostic and doesn't inject
# any extra flags itself.
build_command: >
  ./mvnw install -pl {module} -am -DskipTests
  -Dmaven.repo.local=/tmp/.m2/repository -t /tmp/toolchains.xml
  -DskipBlackboxTests=true -Dcheckstyle.skip=true -q

test_command: >
  ./mvnw test -pl {module} -Dtest={test_class}
  -Dsurefire.failIfNoSpecifiedTests=true
  -Dmaven.repo.local=/tmp/.m2/repository -t /tmp/toolchains.xml
  -DskipBlackboxTests=true -Dcheckstyle.skip=true -q

# ── Tools ──────────────────────────────────────────────────────────────────
tools:
  raw-claude:
    enabled: true
    display_name: "Raw Claude / Opus 4.6"
    model: claude-opus-4-6
    image: quay.io/supathak/crate-backport-test:latest

  amalgamator:
    enabled: true
    display_name: "Amalgamator / Opus 4.6"
    model: claude-opus-4-6
    image: quay.io/supathak/crate-backport-test:latest

# ── OpenShift execution ────────────────────────────────────────────────────
openshift:
  namespace: backport-agent-leaderboard
  vertex_project: itpc-gcp-octo-eng-claude
  vertex_region: global
  job_timeout_seconds: 5400
  resources:
    raw-claude:
      memory: "4Gi"
      cpu: "2"
    amalgamator:
      memory: "8Gi"
      cpu: "2"
