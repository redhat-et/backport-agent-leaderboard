[project]
name = "backport-agent-leaderboard"
version = "0.2.0"
description = "Backport benchmark: Harbor dataset, evaluation docs, and results for backporting pipelines"
readme = "README.md"
authors = [
    { name = "Surya Prakash Pathak", email = "supathak@redhat.com" },
    { name = "Taylor Agarwal", email = "taagarwa@redhat.com" },
]
requires-python = ">=3.13"
dependencies = [
    "harbor>=0.23.0",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

# The Python package keeps its original name so agent references stay stable:
#   -a amalgamator_tasks.amalgamator:Amalgamator
[tool.uv.build-backend]
module-name = "amalgamator_tasks"
